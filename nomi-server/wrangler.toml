name = "nomi"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
APP_URL = "https://edennee-site.github.io/projects/porsiya/"
ALLOW_ORIGIN = "https://edennee-site.github.io"
DAILY_LIMIT = "20"
MODEL = "gemini-flash-latest"

[[d1_databases]]
binding = "DB"
database_name = "nomi"
database_id = "ВСТАВИТЬ_ПОСЛЕ_СОЗДАНИЯ"

[triggers]
crons = ["0 * * * *"]
